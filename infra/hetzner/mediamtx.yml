# MediaMTX configuration for Swypik live commerce
# Docs: https://github.com/bluenviron/mediamtx
api: yes
apiAddress: :9997

hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsAlwaysRemux: yes
hlsSegmentCount: 5
hlsSegmentDuration: 2s

rtmp: yes
rtmpAddress: :1935

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: read
  - user: streamer
    permissions:
      - action: publish
        path: ~^live/.+$

# Lifecycle hooks → notify Next.js (sub pathDefaults, quotate — YAML valid)
pathDefaults:
  runOnReady: "curl -fsS -X POST http://swypik-prod-web-next-1:3000/api/internal/live/started -H \"X-Internal: $INTERNAL_SECRET\" -d \"path=$MTX_PATH\""
  runOnNotReady: "curl -fsS -X POST http://swypik-prod-web-next-1:3000/api/internal/live/ended -H \"X-Internal: $INTERNAL_SECRET\" -d \"path=$MTX_PATH\""
