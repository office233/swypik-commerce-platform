# ============================================================================
# Swypik Production — Hetzner VPS
# ============================================================================
# Usage:
#   cd infra/hetzner
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# IMPORTANT: Production Docker builds set NEXT_BUILD_STANDALONE=1.
# next.config.mjs uses that flag to emit .next/standalone/ only for deploy
# builds, while local and CI builds keep the default output mode.
# ============================================================================

name: swypik-prod

services:

  # ──────────────────────────────────────────────
  # 1. web-next — Next.js 14 standalone SSR
  # ──────────────────────────────────────────────
  web-next:
    build:
      context: ../../
      dockerfile_inline: |
        # ── Build stage ──
        FROM node:20-alpine AS builder
        WORKDIR /app

        # Install deps first (Docker layer cache)
        COPY package.json package-lock.json ./
        RUN npm ci --ignore-scripts

        # Copy source
        COPY . .

        # Build Next.js in standalone mode for deploy images only.
        ENV NEXT_BUILD_STANDALONE=1
        RUN npm run build

        # ── Runtime stage ──
        FROM node:20-alpine AS runner
        WORKDIR /app

        ENV NODE_ENV=production
        ENV PORT=3000
        ENV HOSTNAME="0.0.0.0"

        RUN addgroup --system --gid 1001 nodejs && \
            adduser  --system --uid 1001 nextjs

        # Copy standalone output
        COPY --from=builder /app/.next/standalone ./
        COPY --from=builder /app/.next/static ./.next/static
        COPY --from=builder /app/public ./public

        # Fix cache permissions
        RUN chown -R nextjs:nodejs /app/.next
        RUN mkdir -p /app/.next/cache && chown -R nextjs:nodejs /app/.next/cache

        USER nextjs
        EXPOSE 3000

        CMD ["node", "server.js"]
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 2. platform-api — Go REST/gRPC API
  # ──────────────────────────────────────────────
  platform-api:
    build:
      context: ../../services/platform-api
      dockerfile_inline: |
        # ── Build stage ──
        FROM golang:1.26-bookworm AS builder
        RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
        WORKDIR /src

        COPY go.mod go.sum ./
        RUN go mod download

        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o /bin/api ./cmd/api

        # ── Runtime stage ──
        FROM alpine:3.20 AS runner
        RUN apk add --no-cache ca-certificates tzdata
        COPY --from=builder /bin/api /usr/local/bin/api

        EXPOSE 8080
        ENTRYPOINT ["api"]
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 3. postgres — PostgreSQL 16
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - effective_cache_size=1GB
    volumes:
      - swypik_postgres_data:/var/lib/postgresql/data
      - ../../db/migrations/:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 4. redis — Redis 7
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - swypik_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 5. video-worker — Python FFmpeg pipeline
  # ──────────────────────────────────────────────
  video-worker:
    build:
      context: ../../workers/video-worker
      dockerfile_inline: |
        FROM python:3.11-slim

        # System deps for FFmpeg video processing
        RUN apt-get update && \
            apt-get install -y --no-install-recommends ffmpeg && \
            rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt

        COPY . .

        CMD ["python", "-m", "video_worker.main"]
    env_file:
      - .env.production
    volumes:
      - /tmp/video-processing:/tmp/video-processing
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,os; exit(0)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 6. cron-worker — Lightweight scheduled curls
  # ──────────────────────────────────────────────
  cron-worker:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl > /dev/null 2>&1

        echo "🕐 Swypik cron-worker started"

        while true; do
          TICK=$$(date +%s)

          # ── Every 15 min: process-dropship ──
          if [ $$((TICK % 900)) -lt 60 ]; then
            echo "[cron] $$(date -Iseconds) → process-dropship"
            curl -sf -X POST \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              http://web-next:3000/api/cron/process-dropship || true
          fi

          # ── Every 30 min: process-payouts ──
          if [ $$((TICK % 1800)) -lt 60 ]; then
            echo "[cron] $$(date -Iseconds) → process-payouts"
            curl -sf -X POST \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              http://web-next:3000/api/cron/process-payouts || true
          fi

          # ── Every 4 hours: abandoned-cart ──
          if [ $$((TICK % 14400)) -lt 60 ]; then
            echo "[cron] $$(date -Iseconds) → abandoned-cart"
            curl -sf -X POST \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              http://web-next:3000/api/cron/abandoned-cart || true
          fi

          # ── Every 1 hour: sync-dropship-status ──
          if [ $$((TICK % 3600)) -lt 60 ]; then
            echo "[cron] $$(date -Iseconds) → sync-dropship-status"
            curl -sf -X POST \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              http://web-next:3000/api/cron/sync-dropship-status || true
          fi

          sleep 60
        done
    env_file:
      - .env.production
    depends_on:
      web-next:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sh' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # 7. caddy — Reverse proxy + auto TLS
  # ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      - ../../infra/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro
      - swypik_caddy_data:/data
      - swypik_caddy_config:/config
    depends_on:
      web-next:
        condition: service_started
      platform-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ============================================================================
# Named volumes — persistent data on Hetzner VPS disk
# ============================================================================
volumes:
  swypik_postgres_data:
  swypik_redis_data:
  swypik_caddy_data:
  swypik_caddy_config:
