port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

redis:
  address: redis:6379
  db: 1

# API keys are provided via the LIVEKIT_KEYS env var (see docker-compose.social.yml),
# never hardcoded here — a committed secret is a secret leak regardless of
# whether it's labelled "dev".

logging:
  json: true
  level: info

room:
  empty_timeout: 300
  max_participants: 50
