name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholder env (real secrets only used at runtime on VPS)
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      REDIS_URL: "redis://localhost:6379"
      NEXT_PUBLIC_SITE_URL: "https://swypik.com"
      NEXTAUTH_SECRET: "ci-placeholder-not-real"
      SESSION_SECRET: "ci-placeholder-not-real"
      ADMIN_SECRET: "ci-placeholder-not-real"
      INTERNAL_HEALTH_SECRET: "ci-placeholder-not-real"
      SUPPLIER_WEBHOOK_SECRET: "ci-placeholder-not-real"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build
